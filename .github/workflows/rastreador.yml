name: Robô do Rastreador (5 em 5 min)

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  rodar-rastreador:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3

      - name: Instalar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas (requirements)
        run: pip install requests yfinance pandas pytz

      - name: Rodar o script principal
        run: python rastreador-vercel/rastreador.py